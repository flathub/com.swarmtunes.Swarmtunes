id: com.swarmtunes.Swarmtunes

runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk

command: swarmtunes

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=pulseaudio

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node26
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/node26/bin:/usr/lib/sdk/rust-stable/bin
  env:
    XDG_CACHE_HOME: /run/build/swarmtunes/flatpak-node/cache
    npm_config_cache: /run/build/swarmtunes/flatpak-node/npm-cache
    npm_config_offline: "true"

modules:
  - name: swarmtunes
    buildsystem: simple

    build-commands:
      - mkdir -p src-tauri/.cargo
      - cp cargo-config.toml src-tauri/.cargo/config.toml

      - npm ci --offline
      - npm run tauri build -- --no-bundle

      - install -Dm755 src-tauri/target/release/swarmtunes /app/bin/swarmtunes

      - install -Dm644 data/.desktop /app/share/applications/com.swarmtunes.Swarmtunes.desktop
      - install -Dm644 data/.metainfo.xml /app/share/metainfo/com.swarmtunes.Swarmtunes.metainfo.xml

      - install -Dm644 src-tauri/icons/256x256.png /app/share/icons/hicolor/256x256/apps/com.swarmtunes.Swarmtunes.png
      - install -Dm644 LICENSE /app/share/licenses/$FLATPAK_ID/swarmtunes/LICENSE

    sources:
      - type: git
        url: https://github.com/AceandGaming/swarmtunes-client.git
        commit: bb0fa9e4a20bc60002b0411c8ec7ed3034b709c9

      - cargo-sources.json
      - node-sources.json

      - type: file
        path: cargo-config.toml
